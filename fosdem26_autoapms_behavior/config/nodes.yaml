VelocityPub:
  class_name: fosdem26_autoapms_behavior::VelocityPub
  description: "Publishes a velocity command to control the robot hand movement"
  topic: /robot/velocity_cmd

MoveLeft:
  class_name: fosdem26_autoapms_behavior::VelocityPub
  description: "Action node that commands the robot hand to move left"
  topic: /robot/velocity_cmd
  port_default:
    velocity: -1.0
  hidden_ports:
    - velocity

MoveRight:
  class_name: fosdem26_autoapms_behavior::VelocityPub
  description: "Action node that commands the robot hand to move right"
  topic: /robot/velocity_cmd
  port_default:
    velocity: 1.0
  hidden_ports:
    - velocity

PositionInRange:
  class_name: fosdem26_autoapms_behavior::PositionInRange
  description: "Checks if robot position is within a specified range [low, high]"
  topic: /robot/position

HandIsFarLeft:
  class_name: fosdem26_autoapms_behavior::PositionInRange
  description: "Condition node that checks if the robot hand is on the left side"
  topic: /robot/position
  port_default:
    low: -1.0
    high: -0.9
  hidden_ports:
    - low
    - high

HandIsFarRight:
  class_name: fosdem26_autoapms_behavior::PositionInRange
  description: "Condition node that checks if the robot hand is on the right side"
  topic: /robot/position
  port_default:
    low: 0.9
    high: 1.0
  hidden_ports:
    - low
    - high
