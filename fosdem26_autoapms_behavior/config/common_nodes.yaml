#
# Common behavior tree nodes helpful for multiple behaviors
#

# Less semantic meaning - More flexibility through ports

VelocityPub:
  class_name: fosdem26_autoapms_behavior::VelocityPub
  description: "Publishes a velocity command to control the robot hand movement"
  topic: /robot/velocity_cmd

PositionInRange:
  class_name: fosdem26_autoapms_behavior::PositionInRange
  description: "Checks if robot position is within a specified range [low, high]"
  topic: /robot/position

# More semantic meaning for better readability - Hiding ports prevents misuse

StopMovement:
  class_name: fosdem26_autoapms_behavior::VelocityPub
  description: "Action node that commands the robot hand to stop moving"
  topic: /robot/velocity_cmd
  port_default:
    velocity: 0.0
  hidden_ports:
    - velocity

HandIsCentered:
  class_name: fosdem26_autoapms_behavior::PositionInRange
  description: "Condition node that checks if the robot hand is in the center"
  topic: /robot/position
  port_default:
    low: -0.1
    high: 0.1
  hidden_ports:
    - low
    - high
